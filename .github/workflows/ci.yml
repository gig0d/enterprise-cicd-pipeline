name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Security
    uses: ./.github/workflows/security.yml

  quality:
    name: Quality and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: uv.lock
      - name: Install locked tooling and dependencies
        run: |
          python -m pip install --require-hashes -r .github/requirements-bootstrap.txt
          uv sync --locked
      - name: Validate formatting, lint, types, and dependency export
        run: |
          uv run ruff format --check .
          uv run ruff check .
          uv run mypy
          uv run python -m scripts.check_repository
      - name: Validate workflow syntax
        run: |
          python -m scripts.install_tool actionlint
          .tools/actionlint/actionlint -color
      - name: Unit tests
        run: uv run pytest tests/unit --cov --cov-fail-under=0 --cov-report= --junitxml=reports/unit.xml
      - name: API integration tests and combined coverage gate
        run: uv run pytest tests/integration --cov --cov-append --cov-report=term-missing --cov-report=xml:reports/coverage.xml --junitxml=reports/integration.xml
      - name: Build distributable artifacts
        run: uv run python -m build --no-isolation
      - name: Preserve quality evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-evidence
          path: |
            reports/
            dist/
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish immutable candidate
    needs: [quality, security, container]
    if: >-
      github.repository == 'gig0d/enterprise-cicd-pipeline' &&
      vars.ENABLE_GHCR_PUBLISH == 'true' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: uv.lock
      - run: |
          python -m pip install --require-hashes -r .github/requirements-bootstrap.txt
          uv sync --locked
      - name: Calculate source metadata
        id: metadata
        run: uv run python -m scripts.record_build metadata
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish the immutable candidate with attestations
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/gig0d/enterprise-cicd-pipeline:${{ github.sha }}
          provenance: mode=max
          sbom: generator=docker/buildkit-syft-scanner@sha256:873a7458c3c8ac8e32c7b796c10e1600b07b963d2aa000a72a2d97aaaa2d6315
          build-args: |
            VCS_REF=${{ github.sha }}
            APP_VERSION=${{ steps.metadata.outputs.version }}
            BUILD_DATE=${{ steps.metadata.outputs.built_at }}
      - name: Verify the exact registry image and preserve its metadata
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          BUILD_DATE: ${{ steps.metadata.outputs.built_at }}
          REVISION: ${{ github.sha }}
        run: |
          IMAGE="ghcr.io/gig0d/enterprise-cicd-pipeline@$DIGEST"
          docker pull "$IMAGE"
          uv run python -m scripts.container_smoke --image "$IMAGE" --revision "$REVISION" --environment test --report reports/published-smoke.json
          python -m scripts.install_tool trivy
          .tools/trivy/trivy image --scanners vuln --format json --output reports/published-trivy.json --timeout 5m "$IMAGE"
          uv run python -m scripts.record_build record --digest "$DIGEST"
          docker buildx imagetools inspect "$IMAGE" --format '{{json .Provenance}}' > reports/provenance.json
          docker buildx imagetools inspect "$IMAGE" --format '{{json .SBOM}}' > reports/sbom.json
      - name: Preserve validated build identity
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-record
          path: build-record.json
          if-no-files-found: error
          retention-days: 30
      - name: Preserve registry verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: published-image-evidence
          path: reports/
          if-no-files-found: warn
          retention-days: 30

  staging:
    name: Ephemeral staging
    needs: publish
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/staging.yml
    with:
      digest: ${{ needs.publish.outputs.digest }}

  required:
    name: CI required checks
    if: always()
    needs: [quality, security, container]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Require every mandatory validation job
        env:
          QUALITY: ${{ needs.quality.result }}
          SECURITY: ${{ needs.security.result }}
          CONTAINER: ${{ needs.container.result }}
        run: |
          test "$QUALITY" = success
          test "$SECURITY" = success
          test "$CONTAINER" = success

  container:
    name: Container build and smoke tests
    needs: [quality, security]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: uv.lock
      - run: |
          python -m pip install --require-hashes -r .github/requirements-bootstrap.txt
          uv sync --locked
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the test image
        env:
          REVISION: ${{ github.sha }}
        run: |
          docker buildx build --load --tag pipeline-demo-api:test \
            --build-arg VCS_REF="$REVISION" \
            --build-arg BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" .
      - name: Container lifecycle and HTTP checks
        env:
          REVISION: ${{ github.sha }}
        run: uv run python -m scripts.container_smoke --image pipeline-demo-api:test --revision "$REVISION" --environment test
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Scan the built image and enforce the vulnerability policy
        run: |
          python -m scripts.install_tool trivy
          .tools/trivy/trivy image --scanners vuln --format json --output reports/trivy.json --timeout 5m pipeline-demo-api:test
          uv run python -m scripts.security_gate trivy reports/trivy.json
      - name: Preserve container evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: container-evidence
          path: reports/
          if-no-files-found: warn
          retention-days: 30
