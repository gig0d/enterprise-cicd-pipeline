name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Security
    uses: ./.github/workflows/security.yml

  quality:
    name: Quality and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: uv.lock
      - name: Install locked tooling and dependencies
        run: |
          python -m pip install uv==0.13.6
          uv sync --locked
      - name: Validate formatting, lint, types, and dependency export
        run: |
          uv run ruff format --check .
          uv run ruff check .
          uv run mypy
          uv run python -m scripts.check_repository
      - name: Validate workflow syntax
        run: |
          python -m scripts.install_tool actionlint
          .tools/actionlint/actionlint -color
      - name: Unit tests
        run: uv run pytest tests/unit --cov --cov-fail-under=0 --cov-report= --junitxml=reports/unit.xml
      - name: API integration tests and combined coverage gate
        run: uv run pytest tests/integration --cov --cov-append --cov-report=term-missing --cov-report=xml:reports/coverage.xml --junitxml=reports/integration.xml
      - name: Build distributable artifacts
        run: uv build
      - name: Preserve quality evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-evidence
          path: |
            reports/
            dist/
          if-no-files-found: error
          retention-days: 30

  container:
    name: Container build and smoke tests
    needs: [quality, security]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: uv.lock
      - run: |
          python -m pip install uv==0.13.6
          uv sync --locked
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the test image
        env:
          REVISION: ${{ github.sha }}
        run: |
          docker buildx build --load --tag pipeline-demo-api:test \
            --build-arg VCS_REF="$REVISION" \
            --build-arg BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" .
      - name: Container lifecycle and HTTP checks
        env:
          REVISION: ${{ github.sha }}
        run: uv run python -m scripts.container_smoke --image pipeline-demo-api:test --revision "$REVISION" --environment test
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Scan the built image and enforce the vulnerability policy
        run: |
          python -m scripts.install_tool trivy
          .tools/trivy/trivy image --scanners vuln --format json --output reports/trivy.json --timeout 5m pipeline-demo-api:test
          uv run python -m scripts.security_gate trivy reports/trivy.json
      - name: Preserve container evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: container-evidence
          path: reports/
          if-no-files-found: warn
          retention-days: 30
