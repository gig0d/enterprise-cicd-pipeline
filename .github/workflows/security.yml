name: Security gates

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: '17 8 * * 1'

permissions:
  contents: read

jobs:
  dependencies:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: uv.lock
      - name: Audit all locked runtime and development dependencies
        run: |
          python -m pip install uv==0.13.6
          uv sync --locked
          mkdir -p reports
          uv export --frozen --no-emit-project --no-header --quiet --output-file reports/audit-requirements.txt
          uv run python -m scripts.audit --requirements reports/audit-requirements.txt
      - name: Preserve advisory evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-security-evidence
          path: reports/
          if-no-files-found: warn
          retention-days: 30

  secrets:
    name: Secret scanning
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Scan repository history with the checksum-pinned Gitleaks CLI
        run: |
          python -m scripts.install_tool gitleaks
          mkdir -p reports
          .tools/gitleaks/gitleaks git --redact --no-banner --timeout 300 --report-format json --report-path reports/gitleaks.json
      - name: Preserve redacted scan evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: secret-security-evidence
          path: reports/
          if-no-files-found: warn
          retention-days: 30
