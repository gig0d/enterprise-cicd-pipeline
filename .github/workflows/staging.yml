name: Ephemeral staging validation

on:
  workflow_call:
    inputs:
      digest:
        description: Previously built registry image digest
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: Verify staged digest
    if: github.repository == 'gig0d/enterprise-cicd-pipeline' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: staging
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: uv.lock
      - run: |
          python -m pip install uv==0.13.6
          uv sync --locked
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-record
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull and verify the same immutable image
        env:
          DIGEST: ${{ inputs.digest }}
        run: uv run python -m scripts.stage --digest "$DIGEST"
      - name: Preserve successful staging identity
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: staging-record
          path: staging-record.json
          if-no-files-found: error
          retention-days: 30
      - name: Preserve staging diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: staging-evidence
          path: reports/
          if-no-files-found: warn
          retention-days: 30
